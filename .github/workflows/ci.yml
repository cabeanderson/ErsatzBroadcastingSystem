name: CI

# This repository IS the `scripts` package -- ErsatzTV imports channels out of
# it, and every module resolves as `scripts.<something>`. So the checkout goes
# into a directory named `scripts` and everything runs from its parent, exactly
# as it does in a real deployment. Checking out to the workspace root would put
# the package contents at top level and nothing would import.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          path: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No pip install. The scheduler and the simulator are standard library
      # only, and requirements.txt is deliberately empty of pinned packages --
      # if that ever stops being true, this step failing is the signal.
      - name: Confirm no third-party imports are needed
        run: python -c "import sys; print(sys.version)"

      - name: Byte-compile every module
        run: python -m compileall -q scripts

      - name: Imports and resolution
        run: python -m scripts.testing.test_refactor

      - name: Unit tests
        run: python -m unittest scripts.testing.test_scenarios -v

      # Prose has no test, which is how IMPORTS.md came to document a module
      # layout that had not existed for months. This imports every documented
      # import line and looks up every documented symbol.
      - name: Docs match the code
        run: python -m scripts.testing.doc_audit

  hygiene:
    name: Publish hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: scripts

      # The repository history was rewritten once to remove absolute home
      # paths, a LAN address, and manifests of a personal media library. These
      # checks exist so none of that comes back by accident -- a path typed
      # into a new filler tool is the likely way it would.
      - name: No absolute home paths
        working-directory: scripts
        run: |
          if grep -rInE '/(home|Users)/[a-z][a-z0-9_-]*/' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::Absolute home path committed. Use scripts/config.py instead."
            exit 1
          fi
          echo "clean"

      - name: No private network addresses
        working-directory: scripts
        run: |
          if grep -rInE '\b(192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::Private IP committed. Use config.ERSATZTV_URL / ETV_HOST instead."
            exit 1
          fi
          echo "clean"

      - name: No library manifests
        working-directory: scripts
        run: |
          if git ls-files | grep -E '^reference/(library-|registry-inventory|channel-coverage|lineup-audit|acquisitions|bumper-inventory|metadata-facets|next-session)' ; then
            echo "::error::A library manifest is tracked. These inventory a personal collection and are gitignored on purpose."
            exit 1
          fi
          echo "clean"

      - name: Relative documentation links resolve
        working-directory: scripts
        run: |
          broken=0
          for src in $(git ls-files '*.md'); do
            dir=$(dirname "$src")
            targets=$(grep -ohE '\]\([A-Za-z0-9._/-]+\.(md|txt|tsv)[^)]*\)' "$src" 2>/dev/null \
                      | sed -E 's/^\]\(//; s/[)#].*$//' | sort -u)
            for t in $targets; do
              resolved=$(realpath -m --relative-to=. "$dir/$t")
              if ! git ls-files --error-unmatch "$resolved" >/dev/null 2>&1; then
                echo "broken: $src -> $t"
                broken=1
              fi
            done
          done
          [ "$broken" -eq 0 ] || { echo "::error::Documentation links point at untracked files."; exit 1; }
          echo "clean"
